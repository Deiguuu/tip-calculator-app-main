<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Tip calculator app</title>

</head>
<div class="logo"><img src="images/logo.svg" alt=""></div>
 <div class="tip-calculator">
  <label for="">Bill</label>
  <input type="number" class="input bill-input" id="bill-input">
  <label for="">Select Tip %</label>
  <div class="tip"></div>
    <div class="tips tips-5">5%</div>
    <div class="tips tips-10">10%</div>
    <div class="tips tips-15 active-tip">15%</div>
    <div class="tips tips-25">25%</div>
    <div class="tips tips-50">50%</div>
    <div id="tip-custom"><input type="number" class="tip-custom" placeholder="CUSTOM"></div>
  </div>
 <script src="script.js"></script>
</body>
</html>
